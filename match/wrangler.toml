# NetherFlow's match cache on Cloudflare's free plan (see worker.js). Logged in once with `npx wrangler login`, then from
# this folder: npx wrangler deploy  — then set MATCH_CACHE in index.html to the deployed https URL + /m.
name = "netherflow-match"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# nothing logged or kept about requests
[observability]
enabled = false

[[durable_objects.bindings]]
name = "CACHE"
class_name = "Cache"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Cache"]
